<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Ativar alertas — FinControl 360°</title>
  <meta name="theme-color" content="#080D19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest?v=8">
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:#080d19; color:#e8eef8; min-height:100vh; display:grid; place-items:center; padding:24px; }
    .card { max-width:420px; width:100%; background:#122038; border:1px solid rgba(132,223,66,.35);
      border-radius:18px; padding:22px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
    h1 { font-size:1.25rem; margin:0 0 8px; }
    p { color:#aab4c6; line-height:1.45; font-size:.95rem; }
    button { width:100%; margin-top:12px; border:0; border-radius:12px; padding:14px 16px; font-weight:700;
      background:#84df42; color:#081018; cursor:pointer; }
    button.secondary { background:transparent; color:#e8eef8; border:1px solid rgba(255,255,255,.2); }
    .ok { color:#84df42; } .err { color:#ff8f8f; } .muted { font-size:.8rem; color:#7f8aa3; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Alertas de vencimento</h1>
    <p id="msg">Ative as notificações da PWA FinControl 360° para receber avisos mesmo com o app fechado (quando o dispositivo suportar).</p>
    <p class="muted" id="ctx"></p>
    <button id="btn">Ativar notificações</button>
    <button class="secondary" id="btnOpen" type="button">Abrir FinControl 360°</button>
  </div>
  <script src="./pwa-register.js?v=8" defer></script>
  <script>
  (function(){
    'use strict';
    var VAPID_PUBLIC = "BBQlGY5mB9iVOA2suNGpHnLkGZQjyvs7ol2DnzFspMvcfKOc23S9q1GJOsXTFHZDdsjQVCVKMMsKuVRXwpy5DaU";
    var WEBAPP_OFICIAL = "https://script.google.com/macros/s/AKfycbyHjSVSYdbHIEuzuqrWaqe-YZXuvyx21fkiNBiJhZj0eyBoeINCK5D1cD1efnzaLRs6Xg/exec";
    var WEBAPP_HOMOLOG = "https://script.google.com/macros/s/AKfycbwyT_H_t-f9fZp3F9vOp4jMbbMpLELbegQAJ0VLMiCsHoBGqGSFAKe399RgXHKqw2tYUA/exec";
    var ALLOWED_RETURN = [WEBAPP_OFICIAL, WEBAPP_HOMOLOG];
    var params = new URLSearchParams(location.search);
    var code = params.get('code') || '';
    var ret = params.get('return') || params.get('webapp') || '';
    var WEBAPP = (ALLOWED_RETURN.indexOf(ret) >= 0) ? ret : WEBAPP_OFICIAL;
    var msg = document.getElementById('msg');
    var ctx = document.getElementById('ctx');
    var btn = document.getElementById('btn');
    function isStandalone() {
      try { if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true; } catch (e1) {}
      return !!(navigator.standalone);
    }
    function suportePush() {
      return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
    }
    function urlBase64ToUint8Array(base64String) {
      var padding = '='.repeat((4 - base64String.length % 4) % 4);
      var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      var raw = atob(base64);
      var out = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
      return out;
    }
    function setErr(t) { msg.innerHTML = '<span class="err">' + t + '</span>'; }
    function setOk(t) { msg.innerHTML = '<span class="ok">' + t + '</span>'; }
    ctx.textContent = isStandalone() ? 'Modo instalado (PWA) detectado.' : 'No iPhone, abra pelo ícone da Tela de Início para Web Push completo.';
    if (!suportePush()) { setErr('Este navegador/contexto não suporte Web Push. No iPhone, use a PWA instalada.'); btn.disabled = true; }
    if (!code) ctx.textContent += ' Use o botão Ativar dentro do FinControl para vincular sua conta.';
    document.getElementById('btnOpen').onclick = function(){ location.href = WEBAPP; };
    btn.addEventListener('click', async function(){
      btn.disabled = true;
      try {
        if (!suportePush()) throw new Error('Web Push indisponível neste contexto');
        if (!isStandalone() && /iPhone|iPad|iPod/i.test(navigator.userAgent)) {
          setErr('Instale o FinControl na Tela de Início e abra pelo ícone antes de ativar o push no iPhone.');
          btn.disabled = false; return;
        }
        var reg = await navigator.serviceWorker.register('./sw.js');
        try { await reg.update(); } catch (eU) {}
        await navigator.serviceWorker.ready;
        var perm = await Notification.requestPermission();
        if (perm !== 'granted') {
          setErr(perm === 'denied' ? 'Permissão negada. Reative nas Configurações do dispositivo > Notificações.' : 'Permissão não concedida.');
          btn.disabled = false; return;
        }
        var sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC) });
        var jsonSub = sub.toJSON();
        try { localStorage.setItem('fc_push_subscription_endpoint', jsonSub.endpoint || ''); } catch (eL) {}
        if (!code) { setOk('Subscription local criada. Volte ao FinControl e toque Ativar para vincular à conta.'); btn.disabled = false; return; }
        var payload = btoa(unescape(encodeURIComponent(JSON.stringify({ subscription: jsonSub, meta: { userAgent: navigator.userAgent || '' } }))));
        location.href = WEBAPP + '?fcpush=1&code=' + encodeURIComponent(code) + '#' + payload;
      } catch (err) { setErr(String((err && err.message) || err)); btn.disabled = false; }
    });
  })();
  </script>
</body>
</html>
