<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Ativar alertas — FinControl 360°</title>
  <meta name="theme-color" content="#080D19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FinControl 360°">
  <link rel="manifest" href="./manifest.webmanifest?v=9r2">
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:#080d19; color:#e8eef8; min-height:100vh; display:grid; place-items:center; padding:24px; }
    .card { max-width:420px; width:100%; background:#122038; border:1px solid rgba(132,223,66,.35);
      border-radius:18px; padding:22px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
    h1 { font-size:1.25rem; margin:0 0 8px; }
    p { color:#aab4c6; line-height:1.45; font-size:.95rem; }
    button { width:100%; margin-top:12px; border:0; border-radius:12px; padding:14px 16px; font-weight:700;
      background:#84df42; color:#081018; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    button.secondary { background:transparent; color:#e8eef8; border:1px solid rgba(255,255,255,.2); }
    .ok { color:#84df42; } .err { color:#ff8f8f; } .muted { font-size:.8rem; color:#7f8aa3; }
    .meta { margin-top:10px; font-size:.78rem; color:#7f8aa3; line-height:1.4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Alertas de vencimento</h1>
    <p id="msg">Ative as notificações na PWA oficial FinControl 360° (GitHub).</p>
    <p class="muted" id="ctx"></p>
    <div class="meta" id="meta"></div>
    <button id="btn" type="button">Ativar notificações</button>
    <button class="secondary" id="btnOpen" type="button">Abrir FinControl 360°</button>
  </div>
  <script src="./pwa-register.js?v=9r2r2" defer></script>
  <script>
  (function(){
    'use strict';
    var VAPID_PUBLIC = "BBQlGY5mB9iVOA2suNGpHnLkGZQjyvs7ol2DnzFspMvcfKOc23S9q1GJOsXTFHZDdsjQVCVKMMsKuVRXwpy5DaU";
    var ORIGIN_GITHUB = "https://diogolejardam-commits.github.io";
    var PATH_PREFIX = "/fincontrol360/app";
    var WEBAPP_DEV = "https://script.google.com/macros/s/AKfycbwNkB9moeaKqy5155S9tBEB-3YjjgQKsG4qBv1v_AsJ/dev";
    var WEBAPP_HOMOLOG = "https://script.google.com/macros/s/AKfycbwyT_H_t-f9fZp3F9vOp4jMbbMpLELbegQAJ0VLMiCsHoBGqGSFAKe399RgXHKqw2tYUA/exec";
    var WEBAPP_OFICIAL = "https://script.google.com/macros/s/AKfycbyHjSVSYdbHIEuzuqrWaqe-YZXuvyx21fkiNBiJhZj0eyBoeINCK5D1cD1efnzaLRs6Xg/exec";
    // Bridge AS ainda allowlista só /exec; fcpush usa homolog (não @328). Destino canônico UX = /dev via launch.
    var ALLOWED_RETURN = [WEBAPP_DEV, WEBAPP_HOMOLOG, WEBAPP_OFICIAL];
    var TIMEOUT_MS = 20000;
    var MSG_BLOQUEADO = 'As notificações estão bloqueadas neste iPhone. Reative em Ajustes > Notificações > FinControl 360°.';
    var MSG_DEFAULT = 'Ative as notificações para continuar.';
    var MSG_SOLICITANDO = 'Solicitando permissão…';
    var MSG_GRANTED_PROGRESS = 'Permissão concedida. Finalizando ativação…';
    var MSG_SUCESSO = '✅ Notificações ativadas neste iPhone.';
    var MSG_ATIVAS = '✅ Notificações ativas neste iPhone.';
    var MSG_LOCAL_PREPARED = 'Notificações preparadas neste iPhone. Entre no FinControl para concluir o vínculo com sua conta.';
    var LS_PUSH_LOCAL = 'fc_pwa_push_local_prepared';
    var LS_PUSH_BOUND = 'fc_pwa_push_bound';
    var LS_PUSH_SKIP = 'fc_pwa_push_skip';
    var LS_PUSH_ATIVO = 'fc12_push_ativo';

    var params = new URLSearchParams(location.search);
    var code = params.get('code') || '';
    var ret = params.get('return') || params.get('webapp') || '';
    // Nunca usar /dev no redirect fcpush (bridge cairia em @328). Preferir return allowlisted /exec; default homolog.
    var WEBAPP = (ret === WEBAPP_HOMOLOG || ret === WEBAPP_OFICIAL) ? ret : WEBAPP_HOMOLOG;

    var msg = document.getElementById('msg');
    var ctx = document.getElementById('ctx');
    var meta = document.getElementById('meta');
    var btn = document.getElementById('btn');
    var pending = false;
    var opId = 0;
    var lastGestureAt = 0;

    function isStandalone() {
      try { if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true; } catch (e1) {}
      return !!(navigator.standalone);
    }
    function suportePush() {
      return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
    }
    function hostIsAppsScript() {
      try {
        var h = String(location.hostname || '');
        return /script\.google\.com$/i.test(h) || /googleusercontent\.com$/i.test(h);
      } catch (e0) { return false; }
    }
    /** Classificação explícita — nunca ambígua. */
    function classificarContexto_() {
      if (hostIsAppsScript()) return 'APPS_SCRIPT';
      var originOk = false;
      var pathOk = false;
      try {
        originOk = location.origin === ORIGIN_GITHUB;
        pathOk = String(location.pathname || '').indexOf(PATH_PREFIX) === 0;
      } catch (e1) {}
      if (!originOk || !pathOk) return 'CONTEXTO_NAO_SUPORTADO';
      if (!suportePush()) return 'CONTEXTO_NAO_SUPORTADO';
      if (!isStandalone()) return 'SAFARI_GITHUB';
      return 'PWA_GITHUB_VALIDA';
    }
    function urlBase64ToUint8Array(base64String) {
      var padding = '='.repeat((4 - base64String.length % 4) % 4);
      var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      var raw = atob(base64);
      var out = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
      return out;
    }
    function setErr(t) { msg.innerHTML = '<span class="err">' + t + '</span>'; }
    function setOk(t) { msg.innerHTML = '<span class="ok">' + t + '</span>'; }
    function setInfo(t) { msg.textContent = t; }
    function setMeta(lines) {
      meta.innerHTML = (lines || []).map(function (l) { return '<div>' + l + '</div>'; }).join('');
    }
    /** Sempre ler o valor vivo — nunca cachear permission entre passos. */
    function lerPermission_() {
      try {
        if (typeof Notification === 'undefined') return 'n/a';
        return String(Notification.permission || 'default');
      } catch (e0) { return 'n/a'; }
    }
    function marcarLocalPrepared_() {
      try { localStorage.setItem(LS_PUSH_LOCAL, '1'); } catch (e0) {}
    }
    function marcarBackendBound_() {
      try { localStorage.setItem(LS_PUSH_BOUND, '1'); } catch (e0) {}
      try { localStorage.setItem(LS_PUSH_ATIVO, '1'); } catch (e1) {}
      try { localStorage.setItem('fc12_notif_user_choice', 'granted'); } catch (e2) {}
    }
    function marcarSkipPush_() {
      try { localStorage.setItem(LS_PUSH_SKIP, '1'); } catch (e0) {}
    }
    function jaBackendBound_() {
      try { return localStorage.getItem(LS_PUSH_BOUND) === '1'; } catch (e0) { return false; }
    }
    function jaLocalPrepared_() {
      try { return localStorage.getItem(LS_PUSH_LOCAL) === '1'; } catch (e0) { return false; }
    }
    function jaAtivoLocal_() {
      return jaBackendBound_();
    }
    function refreshMeta_(extra) {
      var lines = [
        'Contexto: ' + classificarContexto_(),
        'Permissão: ' + lerPermission_(),
        'Código de vínculo: ' + (code ? 'presente' : 'ausente')
      ];
      if (extra && extra.length) {
        for (var i = 0; i < extra.length; i++) lines.push(extra[i]);
      }
      setMeta(lines);
    }
    function gestureRecente_() {
      return (Date.now() - lastGestureAt) < 5000;
    }
    async function ensureRegistration_() {
      if (!('serviceWorker' in navigator)) throw new Error('Service Worker indisponível');
      var reg = await navigator.serviceWorker.register('./sw.js');
      try { await reg.update(); } catch (eU) {}
      await navigator.serviceWorker.ready;
      if (!reg || !reg.pushManager) throw new Error('PushManager indisponível neste Service Worker');
      return reg;
    }
    async function getOrCreateSubscription_(reg) {
      var existing = null;
      try { existing = await reg.pushManager.getSubscription(); } catch (eG) {
        throw new Error('Falha ao ler subscription existente.');
      }
      if (existing) return { sub: existing, reused: true };
      var sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
      });
      return { sub: sub, reused: false };
    }

    /**
     * Garante permission=granted.
     * - denied → bloqueado (única mensagem de Ajustes)
     * - default → requestPermission SOMENTE com gesto recente; senão espera toque
     * - granted → segue
     * Relê Notification.permission após qualquer request.
     */
    async function garantirPermissionGranted_(opts) {
      opts = opts || {};
      var allowRequest = !!opts.allowRequest;
      var perm = lerPermission_();
      refreshMeta_();

      if (perm === 'denied') {
        throw new Error(MSG_BLOQUEADO);
      }
      if (perm === 'granted') {
        return 'granted';
      }

      // default / n/a / outro — NÃO é bloqueado
      if (!allowRequest || !gestureRecente_()) {
        setInfo(MSG_DEFAULT);
        refreshMeta_(['Ação: toque em Ativar notificações (gesto obrigatório no iOS)']);
        var waitErr = new Error(MSG_DEFAULT);
        waitErr.code = 'NEED_GESTURE';
        throw waitErr;
      }

      setInfo(MSG_SOLICITANDO);
      refreshMeta_(['Ação: solicitando permissão do sistema']);
      var result = 'default';
      try {
        result = await Notification.requestPermission();
      } catch (eReq) {
        result = lerPermission_();
      }
      // Fonte de verdade = valor vivo pós-prompt (não confiar só no retorno)
      perm = lerPermission_();
      if (perm === 'n/a' && result) perm = String(result);
      refreshMeta_(['Resultado requestPermission: ' + String(result)]);

      if (perm === 'granted') return 'granted';
      if (perm === 'denied') throw new Error(MSG_BLOQUEADO);

      // Ainda default (prompt dispensado / iOS sem gesto efetivo)
      var soft = new Error('Permissão ainda não concedida. Toque novamente em Ativar notificações.');
      soft.code = 'STILL_DEFAULT';
      throw soft;
    }

    function aplicarUiInicial_() {
      var contexto = classificarContexto_();
      var labels = {
        PWA_GITHUB_VALIDA: 'PWA oficial GitHub válida (standalone).',
        SAFARI_GITHUB: 'Safari na origem GitHub — no iPhone, abra pelo ícone FinControl 360° da Tela de Início instalado a partir desta página GitHub (não o Apps Script).',
        APPS_SCRIPT: 'Contexto Apps Script — não é a PWA oficial. Abra a PWA GitHub.',
        CONTEXTO_NAO_SUPORTADO: 'Contexto não suportado para Web Push.'
      };
      ctx.textContent = labels[contexto] || labels.CONTEXTO_NAO_SUPORTADO;
      refreshMeta_();

      var perm = lerPermission_();
      if (contexto === 'APPS_SCRIPT' || contexto === 'CONTEXTO_NAO_SUPORTADO') {
        setErr('Abra o FinControl 360° pela PWA oficial instalada a partir de GitHub Pages.');
        btn.disabled = true;
      } else if (contexto === 'SAFARI_GITHUB' && /iPhone|iPad|iPod/i.test(navigator.userAgent || '')) {
        setInfo('Esta página abriu no Safari. No iPhone, abra pelo ícone FinControl 360° da Tela de Início (PWA GitHub). O código de vínculo permanece nesta URL por alguns minutos.');
        btn.textContent = 'Ativar notificações';
        btn.disabled = true;
      } else if (perm === 'denied') {
        setErr(MSG_BLOQUEADO);
        btn.disabled = true;
      } else if (perm === 'granted') {
        setInfo(MSG_GRANTED_PROGRESS);
        btn.textContent = 'Confirmar subscription';
        btn.disabled = false;
      } else {
        // default = precisa de ação — NUNCA "bloqueado"
        setInfo(MSG_DEFAULT);
        btn.textContent = 'Ativar notificações';
        btn.disabled = false;
      }

      if (!code) {
        if (!code) ctx.textContent += ' Ative aqui na PWA instalada. Depois abra o FinControl.';
      }
    }


    /**
     * Bind no mesmo contexto PWA (JSONP) — NÃO navega para script.google.com.
     * Evita tela branca / perda do shell standalone no iOS.
     */
    function bindViaJsonp_(codeVal, subscription, meta) {
      return new Promise(function (resolve, reject) {
        var cbName = 'fcPushBindCb_' + String(Date.now()) + '_' + String(Math.floor(Math.random() * 1e6));
        var settled = false;
        var scriptEl = null;
        var timer = setTimeout(function () {
          finish(function () { reject(new Error('Tempo esgotado ao vincular. Tente novamente.')); });
        }, TIMEOUT_MS);

        function finish(fn) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          try { delete window[cbName]; } catch (eDel) { try { window[cbName] = undefined; } catch (e2) {} }
          try { if (scriptEl && scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl); } catch (eRm) {}
          fn();
        }

        window[cbName] = function (resp) {
          finish(function () { resolve(resp); });
        };

        var q =
          'fcpushbind=1' +
          '&code=' + encodeURIComponent(String(codeVal || '')) +
          '&sub=' + encodeURIComponent(JSON.stringify(subscription || {})) +
          '&meta=' + encodeURIComponent(JSON.stringify(meta || {})) +
          '&callback=' + encodeURIComponent(cbName);

        scriptEl = document.createElement('script');
        scriptEl.async = true;
        scriptEl.src = WEBAPP + (WEBAPP.indexOf('?') >= 0 ? '&' : '?') + q;
        scriptEl.onerror = function () {
          finish(function () {
            reject(new Error('Não foi possível concluir a ativação. Tente novamente.'));
          });
        };
        (document.head || document.documentElement).appendChild(scriptEl);
      });
    }

    function runActivate_(fromUserGesture) {
      if (pending) return;
      if (fromUserGesture) lastGestureAt = Date.now();
      var myOp = ++opId;
      pending = true;
      btn.disabled = true;
      setInfo('Ativando notificações...');
      refreshMeta_();

      var timer = setTimeout(function () {
        if (myOp !== opId) return;
        pending = false;
        btn.disabled = false;
        setErr('Tempo esgotado ao ativar. Tente novamente.');
        refreshMeta_();
      }, TIMEOUT_MS);

      (async function () {
        try {
          var c = classificarContexto_();
          if (c === 'APPS_SCRIPT' || c === 'CONTEXTO_NAO_SUPORTADO') {
            throw new Error('Abra o FinControl 360° pela PWA oficial instalada.');
          }
          if (c === 'SAFARI_GITHUB' && /iPhone|iPad|iPod/i.test(navigator.userAgent || '')) {
            throw new Error('No iPhone, abra pelo ícone da Tela de Início (PWA GitHub), não pelo Safari/Apps Script.');
          }
          if (!suportePush()) throw new Error('Web Push indisponível neste contexto');

          await garantirPermissionGranted_({ allowRequest: !!fromUserGesture });

          setInfo(MSG_GRANTED_PROGRESS);
          refreshMeta_();

          var reg = await ensureRegistration_();
          var ctrl = '';
          try {
            ctrl = (navigator.serviceWorker.controller && navigator.serviceWorker.controller.scriptURL) || 'sem-controller-ainda';
          } catch (eC) { ctrl = 'n/a'; }

          var got;
          try {
            got = await getOrCreateSubscription_(reg);
          } catch (eSub) {
            // Caso especial: permission default mas subscription existente — não destruir
            var permNow = lerPermission_();
            if (permNow !== 'granted') {
              refreshMeta_(['Estado inconsistente: permission=' + permNow]);
            }
            throw eSub;
          }

          // Se permission ainda default mas já há subscription, não apagar — só reportar
          if (lerPermission_() === 'default' && got && got.reused) {
            refreshMeta_([
              'Estado inconsistente: permission=default com subscription existente (reutilizada)',
              'SW: ' + ctrl
            ]);
          } else {
            refreshMeta_([
              'Subscription: sim (' + (got.reused ? 'reutilizada' : 'nova') + ')',
              'SW: ' + ctrl
            ]);
          }

          var jsonSub = got.sub.toJSON();
          try { localStorage.setItem('fc_push_subscription_endpoint', jsonSub.endpoint || ''); } catch (eL) {}

          if (!code) {
            // LOCAL_PREPARED apenas — sem sucesso final / sem BACKEND_BOUND
            marcarLocalPrepared_();
            setInfo(MSG_LOCAL_PREPARED);
            refreshMeta_([
              'Estado: LOCAL_PREPARED',
              'Origin: GitHub PWA',
              'Permissão: ' + lerPermission_(),
              'Subscription: sim (' + (got.reused ? 'reutilizada' : 'nova') + ')',
              'Bind: AUSENTE (code vazio) — sucesso final bloqueado'
            ]);
            btn.textContent = 'Abrir FinControl para vincular';
            btn.disabled = false;
            btn.onclick = function () { location.href = WEBAPP_DEV; };
            return;
          }

          setInfo('Vinculando à sua conta…');
          refreshMeta_(['Bind: JSONP no contexto PWA (sem navegar para script.google.com)']);
          var bindResp = await bindViaJsonp_(code, jsonSub, {
            userAgent: navigator.userAgent || '',
            contexto: c
          });
          var bindOk = !!(bindResp && bindResp.ok === true && !(bindResp.error));
          if (!bindOk) {
            var em = 'Não foi possível concluir a ativação. Tente novamente.';
            try {
              if (bindResp && bindResp.error && bindResp.error.message) {
                var bm = String(bindResp.error.message);
                if (bm.length < 140) em = '❌ ' + bm;
              }
            } catch (eMsg) {}
            throw new Error(em.indexOf('❌') === 0 ? em : ('❌ ' + em));
          }
          marcarBackendBound_();
          setOk(MSG_SUCESSO);
          refreshMeta_([
            'Estado: BACKEND_BOUND',
            'Origin: GitHub PWA',
            'Permissão: ' + lerPermission_(),
            'Bind: ok (fcpushbind)',
            'Contexto: PWA (sem navegação top-level)'
          ]);
          btn.textContent = 'Abrir FinControl 360°';
          btn.disabled = false;
          btn.onclick = function () { location.href = WEBAPP_DEV; };
        } catch (err) {
          var m = String((err && err.message) || err);
          var codeErr = err && err.code;
          refreshMeta_();
          if (codeErr === 'NEED_GESTURE' || codeErr === 'STILL_DEFAULT') {
            setInfo(m);
            btn.disabled = false;
          } else if (m.indexOf('bloqueadas') >= 0 && lerPermission_() !== 'denied') {
            // Nunca manter "bloqueado" se o valor vivo não é denied
            setInfo(MSG_DEFAULT);
            btn.disabled = false;
          } else {
            setErr(m);
          }
        } finally {
          clearTimeout(timer);
          if (myOp === opId) {
            pending = false;
            var p = lerPermission_();
            if (p !== 'denied' && classificarContexto_() === 'PWA_GITHUB_VALIDA') {
              btn.disabled = false;
            }
            refreshMeta_();
          }
        }
      })();
    }

    document.getElementById('btnOpen').onclick = function () {
      // Só após ativação (ou skip explícito). Nunca no meio do requestPermission.
      if (pending) return;
      if (!jaAtivoLocal_() && lerPermission_() !== 'granted') {
        marcarSkipPush_();
      }
      location.href = WEBAPP_DEV;
    };
    document.getElementById('btnOpen').textContent = 'Continuar sem notificações';

    btn.addEventListener('click', function () {
      runActivate_(true);
    });

    aplicarUiInicial_();

    // Reabertura: só BACKEND_BOUND = sucesso final; subscription sozinha = LOCAL_PREPARED
    (async function bootAtivo_() {
      try {
        if (classificarContexto_() !== 'PWA_GITHUB_VALIDA') return;
        if (jaBackendBound_()) {
          setOk(MSG_ATIVAS);
          btn.textContent = 'Abrir FinControl 360°';
          btn.disabled = false;
          btn.onclick = function () { location.href = WEBAPP_DEV; };
          refreshMeta_(['Estado: BACKEND_BOUND']);
          return;
        }
        if (lerPermission_() !== 'granted') return;
        var reg = await ensureRegistration_();
        var existing = null;
        try { existing = await reg.pushManager.getSubscription(); } catch (eG) { existing = null; }
        if (existing && !code) {
          marcarLocalPrepared_();
          setInfo(MSG_LOCAL_PREPARED);
          refreshMeta_(['Estado: LOCAL_PREPARED', 'Subscription local presente', 'Bind: não confirmado']);
          btn.textContent = 'Abrir FinControl para vincular';
          btn.disabled = false;
          btn.onclick = function () { location.href = WEBAPP_DEV; };
        }
      } catch (eBoot) {}
    })();

    /**
     * Auto-continuidade SOMENTE se permission já é granted
     * (não chama requestPermission — seguro sem gesto).
     * Se default: espera toque do usuário (obrigatório no iOS).
     */
    if (code && classificarContexto_() === 'PWA_GITHUB_VALIDA' && lerPermission_() === 'granted') {
      setTimeout(function () { runActivate_(false); }, 200);
    }

    // Export mínimo para harness local (sem efeito em produção)
    try {
      window.__FC_PUSH_ATIVAR__ = {
        lerPermission_: lerPermission_,
        classificarContexto_: classificarContexto_,
        MSG_BLOQUEADO: MSG_BLOQUEADO,
        MSG_DEFAULT: MSG_DEFAULT,
        MSG_SUCESSO: MSG_SUCESSO,
        version: 'v9r2-bind-fail-closed-06'
      };
    } catch (eExp) {}
  })();
  </script>
</body>
</html>
