<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>FinControl 360°</title>
  <meta name="theme-color" content="#080D19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FinControl 360°">
  <meta name="application-name" content="FinControl 360°">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=9r2">
  <link rel="icon" type="image/png" sizes="192x192" href="./fincontrol-icon-192-v3.png?v=9r2">
  <link rel="manifest" href="./manifest.webmanifest?v=9r2">
  <style>
    html, body { margin:0; width:100%; height:100%; background:#080d19; color:#aab4c6;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .boot { min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px; text-align:center; }
    a { color:#84df42; }
    .muted { font-size:.85rem; color:#7f8aa3; max-width:28rem; line-height:1.4; }
  </style>
  <script>
    (function () {
      'use strict';
      // Ambiente canônico = HEAD /dev (fonte de verdade runtime).
      // @328 = histórico/rollback (somente ?env=prod técnico). Homolog = apoio técnico.
      var WEBAPP_CANONICO = 'https://script.google.com/macros/s/AKfycbwNkB9moeaKqy5155S9tBEB-3YjjgQKsG4qBv1v_AsJ/dev';
      var WEBAPP_HOMOLOG = 'https://script.google.com/macros/s/AKfycbwyT_H_t-f9fZp3F9vOp4jMbbMpLELbegQAJ0VLMiCsHoBGqGSFAKe399RgXHKqw2tYUA/exec';
      var WEBAPP_PRODUCAO = 'https://script.google.com/macros/s/AKfycbyHjSVSYdbHIEuzuqrWaqe-YZXuvyx21fkiNBiJhZj0eyBoeINCK5D1cD1efnzaLRs6Xg/exec';
      var ALLOWED = [WEBAPP_CANONICO, WEBAPP_HOMOLOG, WEBAPP_PRODUCAO];
      var ORIGIN_GITHUB = 'https://diogolejardam-commits.github.io';
      var params = new URLSearchParams(location.search || '');

      function resolveAppUrl_() {
        // Parâmetro técnico interno apenas (não exibido ao usuário final).
        var q = params.get('webapp') || params.get('return') || '';
        if (ALLOWED.indexOf(q) >= 0) return q;
        var env = String(params.get('env') || '').toLowerCase();
        if (env === 'prod' || env === 'producao' || env === '328') return WEBAPP_PRODUCAO;
        return WEBAPP_CANONICO;
      }

      // Fluxo Push: permanecer na origem GitHub (standalone).
      if (params.get('push') === '1' || params.get('fcpush') === '1' || params.get('ativar') === '1') {
        location.replace('./push-ativar.html' + (location.search || ''));
        return;
      }

      try {
        if (location.origin !== ORIGIN_GITHUB) {
          document.addEventListener('DOMContentLoaded', function () {
            var el = document.getElementById('bootMsg');
            if (el) el.textContent = 'Abra a PWA oficial em GitHub Pages.';
          });
          return;
        }
      } catch (e0) {}

      var APP_URL = resolveAppUrl_();
      var went = false;
      function goApp() {
        if (went) return;
        went = true;
        window.location.replace(APP_URL);
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          try { reg.update(); } catch (e) {}
          setTimeout(goApp, 350);
        }).catch(goApp);
        setTimeout(goApp, 2200);
      } else {
        goApp();
      }

      document.addEventListener('DOMContentLoaded', function () {
        var a = document.getElementById('fallback');
        if (a) a.href = APP_URL;
      });
    })();
  </script>
</head>
<body>
  <div class="boot">
    <p id="bootMsg">Abrindo FinControl 360°…</p>
    <p class="muted">Entrada canônica: PWA GitHub → runtime oficial /dev (HEAD).</p>
    <p><a id="fallback" href="https://script.google.com/macros/s/AKfycbwNkB9moeaKqy5155S9tBEB-3YjjgQKsG4qBv1v_AsJ/dev">Abrir FinControl 360°</a></p>
  </div>
</body>
</html>
