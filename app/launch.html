<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>FinControl 360°</title>
  <meta name="theme-color" content="#080D19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FinControl 360°">
  <meta name="application-name" content="FinControl 360°">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=7">
  <link rel="icon" type="image/png" sizes="192x192" href="./fincontrol-icon-192-v3.png?v=7">
  <link rel="manifest" href="./manifest.webmanifest?v=7">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #080d19;
      color: #aab4c6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .boot {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    a { color: #84df42; }
  </style>
  <script>
    (function () {
      'use strict';
      // Web App OFICIAL permanente — nunca gerar outro link
      var APP_URL = 'https://script.google.com/macros/s/AKfycbyHjSVSYdbHIEuzuqrWaqe-YZXuvyx21fkiNBiJhZj0eyBoeINCK5D1cD1efnzaLRs6Xg/exec';

      function go() {
        window.location.replace(APP_URL);
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          try { reg.update(); } catch (e) {}
          go();
        }).catch(go);
        setTimeout(go, 1200);
      } else {
        go();
      }
    })();
  </script>
</head>
<body>
  <div class="boot">
    <p>Abrindo FinControl 360°…</p>
    <p><a id="fallback" href="https://script.google.com/macros/s/AKfycbyHjSVSYdbHIEuzuqrWaqe-YZXuvyx21fkiNBiJhZj0eyBoeINCK5D1cD1efnzaLRs6Xg/exec">Abrir FinControl 360°</a></p>
  </div>
</body>
</html>
