<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Ativar alertas — FinControl 360°</title>
  <meta name="theme-color" content="#080D19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FinControl 360°">
  <link rel="manifest" href="./manifest.webmanifest?v=9r2">
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:#080d19; color:#e8eef8; min-height:100vh; display:grid; place-items:center; padding:24px; }
    .card { max-width:420px; width:100%; background:#122038; border:1px solid rgba(132,223,66,.35);
      border-radius:18px; padding:22px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
    h1 { font-size:1.25rem; margin:0 0 8px; }
    p { color:#aab4c6; line-height:1.45; font-size:.95rem; }
    button { width:100%; margin-top:12px; border:0; border-radius:12px; padding:14px 16px; font-weight:700;
      background:#84df42; color:#081018; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    button.secondary { background:transparent; color:#e8eef8; border:1px solid rgba(255,255,255,.2); }
    .ok { color:#84df42; } .err { color:#ff8f8f; } .muted { font-size:.8rem; color:#7f8aa3; }
    .meta { margin-top:10px; font-size:.78rem; color:#7f8aa3; line-height:1.4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Alertas de vencimento</h1>
    <p id="msg">Ative as notificações na PWA oficial FinControl 360° (GitHub).</p>
    <p class="muted" id="ctx"></p>
    <div class="meta" id="meta"></div>
    <button id="btn" type="button">Ativar notificações</button>
    <button class="secondary" id="btnOpen" type="button">Abrir FinControl 360°</button>
  </div>
  <script src="./pwa-register.js?v=9r2r2" defer></script>
  <script>
  (function(){
    'use strict';
    var VAPID_PUBLIC = "BBQlGY5mB9iVOA2suNGpHnLkGZQjyvs7ol2DnzFspMvcfKOc23S9q1GJOsXTFHZDdsjQVCVKMMsKuVRXwpy5DaU";
    var ORIGIN_GITHUB = "https://diogolejardam-commits.github.io";
    var PATH_PREFIX = "/fincontrol360/app";
    var WEBAPP_DEV = "https://script.google.com/macros/s/AKfycbwNkB9moeaKqy5155S9tBEB-3YjjgQKsG4qBv1v_AsJ/dev";
    var WEBAPP_HOMOLOG = "https://script.google.com/macros/s/AKfycbwyT_H_t-f9fZp3F9vOp4jMbbMpLELbegQAJ0VLMiCsHoBGqGSFAKe399RgXHKqw2tYUA/exec";
    var WEBAPP_OFICIAL = "https://script.google.com/macros/s/AKfycbyHjSVSYdbHIEuzuqrWaqe-YZXuvyx21fkiNBiJhZj0eyBoeINCK5D1cD1efnzaLRs6Xg/exec";
    // Bridge AS ainda allowlista só /exec; fcpush usa homolog (não @328). Destino canônico UX = /dev via launch.
    var ALLOWED_RETURN = [WEBAPP_DEV, WEBAPP_HOMOLOG, WEBAPP_OFICIAL];
    var TIMEOUT_MS = 20000;

    var params = new URLSearchParams(location.search);
    var code = params.get('code') || '';
    var ret = params.get('return') || params.get('webapp') || '';
    // Nunca usar /dev no redirect fcpush (bridge cairia em @328). Preferir return allowlisted /exec; default homolog.
    var WEBAPP = (ret === WEBAPP_HOMOLOG || ret === WEBAPP_OFICIAL) ? ret : WEBAPP_HOMOLOG;

    var msg = document.getElementById('msg');
    var ctx = document.getElementById('ctx');
    var meta = document.getElementById('meta');
    var btn = document.getElementById('btn');
    var pending = false;
    var opId = 0;

    function isStandalone() {
      try { if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true; } catch (e1) {}
      return !!(navigator.standalone);
    }
    function suportePush() {
      return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
    }
    function hostIsAppsScript() {
      try {
        var h = String(location.hostname || '');
        return /script\.google\.com$/i.test(h) || /googleusercontent\.com$/i.test(h);
      } catch (e0) { return false; }
    }
    /** Classificação explícita — nunca ambígua. */
    function classificarContexto_() {
      if (hostIsAppsScript()) return 'APPS_SCRIPT';
      var originOk = false;
      var pathOk = false;
      try {
        originOk = location.origin === ORIGIN_GITHUB;
        pathOk = String(location.pathname || '').indexOf(PATH_PREFIX) === 0;
      } catch (e1) {}
      if (!originOk || !pathOk) return 'CONTEXTO_NAO_SUPORTADO';
      if (!suportePush()) return 'CONTEXTO_NAO_SUPORTADO';
      if (!isStandalone()) return 'SAFARI_GITHUB';
      return 'PWA_GITHUB_VALIDA';
    }
    function urlBase64ToUint8Array(base64String) {
      var padding = '='.repeat((4 - base64String.length % 4) % 4);
      var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      var raw = atob(base64);
      var out = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
      return out;
    }
    function setErr(t) { msg.innerHTML = '<span class="err">' + t + '</span>'; }
    function setOk(t) { msg.innerHTML = '<span class="ok">' + t + '</span>'; }
    function setInfo(t) { msg.textContent = t; }
    function setMeta(lines) {
      meta.innerHTML = (lines || []).map(function (l) { return '<div>' + l + '</div>'; }).join('');
    }
    function permLabel() {
      try { return (typeof Notification !== 'undefined') ? Notification.permission : 'n/a'; }
      catch (e0) { return 'n/a'; }
    }
    async function ensureRegistration_() {
      var reg = await navigator.serviceWorker.register('./sw.js');
      try { await reg.update(); } catch (eU) {}
      await navigator.serviceWorker.ready;
      return reg;
    }
    async function getOrCreateSubscription_(reg) {
      var existing = null;
      try { existing = await reg.pushManager.getSubscription(); } catch (eG) { existing = null; }
      if (existing) return { sub: existing, reused: true };
      var sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
      });
      return { sub: sub, reused: false };
    }

    var contexto = classificarContexto_();
    var labels = {
      PWA_GITHUB_VALIDA: 'PWA oficial GitHub válida (standalone).',
      SAFARI_GITHUB: 'Safari na origem GitHub — no iPhone, abra pelo ícone da Tela de Início instalado a partir desta página GitHub (não o Apps Script).',
      APPS_SCRIPT: 'Contexto Apps Script — não é a PWA oficial. Abra a PWA GitHub.',
      CONTEXTO_NAO_SUPORTADO: 'Contexto não suportado para Web Push.'
    };
    ctx.textContent = labels[contexto] || labels.CONTEXTO_NAO_SUPORTADO;
    setMeta([
      'Contexto: ' + contexto,
      'Permissão: ' + permLabel(),
      'Código de vínculo: ' + (code ? 'presente' : 'ausente')
    ]);

    if (contexto === 'APPS_SCRIPT' || contexto === 'CONTEXTO_NAO_SUPORTADO') {
      setErr('Abra o FinControl 360° pela PWA oficial instalada a partir de GitHub Pages.');
      btn.disabled = true;
    } else if (contexto === 'SAFARI_GITHUB' && /iPhone|iPad|iPod/i.test(navigator.userAgent || '')) {
      // Não navegar embora nem limpar a UI — permanecer com o código na URL.
      setInfo('Esta página abriu no Safari. No iPhone, abra pelo ícone FinControl 360° da Tela de Início (PWA GitHub). O código de vínculo permanece nesta URL por alguns minutos.');
      btn.textContent = 'Ativar notificações';
      btn.disabled = true;
    } else if (typeof Notification !== 'undefined' && Notification.permission === 'denied') {
      setErr('As notificações estão bloqueadas neste iPhone. Reative em Ajustes > Notificações > FinControl 360°.');
      btn.disabled = true;
    } else if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      btn.textContent = 'Confirmar subscription';
    } else {
      btn.textContent = 'Ativar notificações';
    }

    if (!code) {
      ctx.textContent += ' Use Ativar dentro do FinControl autenticado para gerar o vínculo.';
    }

    document.getElementById('btnOpen').onclick = function () {
      location.href = WEBAPP;
    };

    function runActivate_() {
      if (pending) return;
      var myOp = ++opId;
      pending = true;
      btn.disabled = true;
      setInfo('Ativando notificações...');

      var timer = setTimeout(function () {
        if (myOp !== opId) return;
        pending = false;
        btn.disabled = false;
        setErr('Tempo esgotado ao ativar. Tente novamente.');
      }, TIMEOUT_MS);

      (async function () {
        try {
          var c = classificarContexto_();
          if (c === 'APPS_SCRIPT' || c === 'CONTEXTO_NAO_SUPORTADO') {
            throw new Error('Abra o FinControl 360° pela PWA oficial instalada.');
          }
          if (c === 'SAFARI_GITHUB' && /iPhone|iPad|iPod/i.test(navigator.userAgent || '')) {
            throw new Error('No iPhone, abra pelo ícone da Tela de Início (PWA GitHub), não pelo Safari/Apps Script.');
          }
          if (!suportePush()) throw new Error('Web Push indisponível neste contexto');

          var perm = Notification.permission;
          if (perm === 'denied') {
            throw new Error('As notificações estão bloqueadas neste iPhone. Reative em Ajustes > Notificações > FinControl 360°.');
          }
          if (perm === 'default') {
            perm = await Notification.requestPermission();
          }
          if (perm !== 'granted') {
            throw new Error(perm === 'denied'
              ? 'As notificações estão bloqueadas neste iPhone. Reative em Ajustes > Notificações > FinControl 360°.'
              : 'Permissão não concedida.');
          }

          var reg = await ensureRegistration_();
          var got = await getOrCreateSubscription_(reg);
          var jsonSub = got.sub.toJSON();
          try { localStorage.setItem('fc_push_subscription_endpoint', jsonSub.endpoint || ''); } catch (eL) {}

          setMeta([
            'Contexto: ' + c,
            'Permissão: granted',
            'Subscription: sim (' + (got.reused ? 'reutilizada' : 'nova') + ')',
            'Código: ' + (code ? 'presente' : 'ausente')
          ]);

          if (!code) {
            setOk('Subscription local pronta. Volte ao FinControl autenticado e toque Ativar para vincular à conta.');
            return;
          }

          // Não declara ativo aqui — só envia ao bridge/backend.
          setInfo('Vinculando à sua conta…');
          var payload = btoa(unescape(encodeURIComponent(JSON.stringify({
            subscription: jsonSub,
            meta: { userAgent: navigator.userAgent || '', contexto: c }
          }))));
          location.href = WEBAPP + '?fcpush=1&code=' + encodeURIComponent(code) + '#' + payload;
        } catch (err) {
          setErr(String((err && err.message) || err));
        } finally {
          clearTimeout(timer);
          if (myOp === opId) {
            pending = false;
            if (Notification.permission !== 'denied' && classificarContexto_() === 'PWA_GITHUB_VALIDA') {
              btn.disabled = false;
            }
          }
        }
      })();
    }
    btn.addEventListener('click', function () { runActivate_(); });

    // Um gesto do Ativar no app: se já estamos na PWA válida com código, segue sem segundo toque.
    if (code && classificarContexto_() === 'PWA_GITHUB_VALIDA') {
      setTimeout(function () { runActivate_(); }, 200);
    }
  })();
  </script>
</body>
</html>
